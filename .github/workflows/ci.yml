name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # The decoder, the packet-mode expansion, the frame boundaries and the
      # config format are pure logic; these are the tests that catch a regression
      # without hardware. `LINT=1` also checks formatting and lints.
      - name: Format, lint and test
        run: LINT=1 ./protocol/run-tests.sh

  converter:
    name: converter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the converter's dependency
        run: npm install --prefix z2m
      # the mapping bugs that reached the fan lived here: which cluster a `state`
      # write goes to, and what a stopped fan reports about its speed
      - name: Test
        run: node z2m/test.js

  firmware:
    name: firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ESP32-C6 toolchain
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src --component rustfmt --component clippy \
            --target riscv32imac-unknown-none-elf
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
