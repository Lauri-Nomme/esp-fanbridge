name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # The decoder, the packet-mode expansion, the frame boundaries and the
      # config format are pure logic; these are the tests that catch a regression
      # without hardware. `LINT=1` also checks formatting and lints.
      - name: Format, lint and test
        run: LINT=1 ./protocol/run-tests.sh

  firmware:
    name: firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ESP32-C6 toolchain
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src --component rustfmt --component clippy \
            --target riscv32imac-unknown-none-elf
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
