[workspace]

[package]
name = "esp-fanbridge"
version = "0.2.0"
edition = "2024"

[features]
default = ["esp32c6"]
esp32c6 = [
    "dep:esp32c6-pac",
    "esp-alloc/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-storage/esp32c6",
    "zigbee-mac/esp32c6",
]

[dependencies]
# pure protocol logic, kept in its own crate so it can be unit tested on a host
esp-fanbridge-protocol = { path = "protocol" }
esp-alloc = { version = "0.10.0" }
# no `panic-handler`: the firmware installs its own so the panic can be
# persisted to flash before the reset, and reuses `Backtrace` for the addresses
esp-backtrace = { version = "0.19.0", features = ["println"] }
esp32c6-pac = { package = "esp32c6", version = "=0.23.2", optional = true }
esp-bootloader-esp-idf = { version = "0.5.0" }
esp-hal = { version = "1.1.0", features = ["log-04", "unstable"] }
esp-println = { version = "0.17.0" }
esp-radio = { version = "1.0.0-beta.0", features = ["ieee802154", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "log-04"] }
esp-storage = { version = "0.9.0" }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8"
embassy-embedded-hal = "0.5.0"
critical-section = "1.2"
static_cell = "2.1"
byte = "0.2.7"
# non-blocking console writes (`write_byte_nb`)
log = "0.4"
nb = "1.1.0"

# Zigbee stack, pinned to the fork's `fanbridge-fixes` branch: upstream cannot
# find the network again after a reboot when the configured channels are a range
# (it resumes on `channels.start`), forgets the network when a rejoin is refused,
# and its BDB rejoin has no scan fallback. See the branch for the three commits;
# they are candidates for upstream once they have been reviewed.
zigbee = { git = "https://github.com/Lauri-Nomme/zigbee-rs", rev = "90c852d1f9f196f011a5f5dd1086d88878145e70", features = ["storage"] }
zigbee-types = { git = "https://github.com/Lauri-Nomme/zigbee-rs", rev = "90c852d1f9f196f011a5f5dd1086d88878145e70" }
zigbee-mac = { git = "https://github.com/Lauri-Nomme/zigbee-rs", rev = "90c852d1f9f196f011a5f5dd1086d88878145e70" }
zigbee-cluster-library = { git = "https://github.com/Lauri-Nomme/zigbee-rs", rev = "90c852d1f9f196f011a5f5dd1086d88878145e70" }
